<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-2);}
  .wrap{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(51,51,51,0.06);}
  .card.hover{box-shadow:0 8px 24px rgba(51,51,51,0.08);}
  .eyebrow{font-family:var(--mono);font-size:10px;color:#8A8A8A;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
  .t{font-family:'Libre Baskerville';font-weight:700;font-size:19px;color:#2A4B7C;line-height:1.3;margin:0 0 8px;}
  .p{font-family:'Inter';font-size:13px;line-height:1.55;color:#333;margin:0;}
  .meta{font-family:'JetBrains Mono';font-size:10px;color:#8A8A8A;margin-top:12px;text-transform:uppercase;letter-spacing:0.06em;}
  .tag{display:inline-block;padding:3px 10px;background:#D4E5DF;color:#1F4A3A;border-radius:100px;font-family:'Inter';font-size:11px;font-weight:500;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="tag">Ensayo</span>
    <h3 class="t" style="margin-top:10px;">Por qué escribimos con skin in the game</h3>
    <p class="p">Lo que publicamos lo usamos. Lo que recomendamos lo pagamos.</p>
    <div class="meta">21 ABR 2026 · 4 MIN</div>
  </div>
  <div class="card hover">
    <span class="eyebrow">Card · hover state</span>
    <h3 class="t">Herramientas con memoria larga</h3>
    <p class="p">Un software que sigue siendo útil en diez años, no en diez semanas.</p>
    <div class="meta">SHADOW-MD · SAME TRANSFORM</div>
  </div>
</div>
</body>
</html>
