<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-2);}
  .card{padding:28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .btn{font-family:var(--sans);font-weight:500;font-size:14px;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;transition:all 240ms cubic-bezier(0.2,0.6,0.2,1);}
  .primary{background:#E07A5F;color:#fff;}
  .primary.hover{background:#C96647;}
  .primary.press{background:#B55A3C;transform:scale(0.98);}
  .secondary{background:#fff;color:#333;border:1px solid var(--border);}
  .ghost{background:transparent;color:#2A4B7C;padding:10px 12px;}
  .ghost:hover{color:#E07A5F;}
  .lbl{font-family:var(--mono);font-size:10px;color:#8A8A8A;text-transform:uppercase;letter-spacing:0.08em;align-self:flex-end;margin-left:auto;}
</style>
</head>
<body>
<div class="card">
  <button class="btn primary">Empezar</button>
  <button class="btn primary hover">Hover</button>
  <button class="btn primary press">Press</button>
  <button class="btn secondary">Leer más</button>
  <button class="btn ghost">Ver cómo funciona →</button>
</div>
</body>
</html>
