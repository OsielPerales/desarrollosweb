<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{padding:22px 28px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .mark{width:36px;height:36px;border-radius:10px;background:#2A4B7C;position:relative;display:flex;align-items:center;justify-content:center;}
  .mark::after{content:"";position:absolute;width:14px;height:14px;background:#E07A5F;border-radius:50%;top:8px;right:6px;}
  .word{font-family:'Libre Baskerville';font-weight:700;font-size:22px;color:#2A4B7C;letter-spacing:-0.01em;}
  .tag{font-family:'JetBrains Mono';font-size:10px;color:#8A8A8A;text-transform:uppercase;letter-spacing:0.12em;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mark"></div>
    <div>
      <div class="word">Editorial</div>
      <div class="tag">Humanismo tecnológico</div>
    </div>
  </div>
</div>
</body>
</html>
