<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-2);}
  .card{padding:24px;display:flex;gap:16px;align-items:flex-end;}
  .bar{background:#E07A5F;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar > div{width:100%;background:rgba(42,75,124,0.9);border-radius:4px;}
  .lbl{font-family:var(--mono);font-size:10px;color:#333;text-transform:uppercase;letter-spacing:0.05em;}
  .val{font-family:var(--mono);font-size:10px;color:#8A8A8A;}
  .unit{display:flex;flex-direction:column;align-items:center;gap:4px;}
</style>
</head>
<body>
<div class="card">
  <div class="unit"><div style="width:4px;height:4px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-1</span><span class="val">4</span></div>
  <div class="unit"><div style="width:8px;height:8px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-2</span><span class="val">8</span></div>
  <div class="unit"><div style="width:12px;height:12px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-3</span><span class="val">12</span></div>
  <div class="unit"><div style="width:16px;height:16px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-4</span><span class="val">16</span></div>
  <div class="unit"><div style="width:24px;height:24px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-5</span><span class="val">24</span></div>
  <div class="unit"><div style="width:32px;height:32px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-6</span><span class="val">32</span></div>
  <div class="unit"><div style="width:48px;height:48px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-7</span><span class="val">48</span></div>
  <div class="unit"><div style="width:64px;height:64px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-8</span><span class="val">64</span></div>
  <div class="unit"><div style="width:96px;height:96px;background:#2A4B7C;border-radius:2px;"></div><span class="lbl">s-9</span><span class="val">96</span></div>
</div>
</body>
</html>
