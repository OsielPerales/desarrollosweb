<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-2);}
  .card{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#5C5C5C;margin-bottom:6px;}
  .input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:14px;color:#333;background:#fff;box-sizing:border-box;}
  .input.focus{border-color:#E07A5F;box-shadow:0 0 0 3px rgba(224,122,95,0.15);outline:none;}
  .help{font-family:var(--sans);font-size:12px;color:#8A8A8A;margin-top:6px;}
  .err{font-family:var(--sans);font-size:12px;color:#B55A3C;margin-top:6px;}
  .input.err-state{border-color:#B55A3C;}
</style>
</head>
<body>
<div class="card">
  <div>
    <label>Correo</label>
    <input class="input" value="nosotros@ejemplo.com" />
    <div class="help">Te escribiremos sólo cuando sea útil.</div>
  </div>
  <div>
    <label>Contraseña</label>
    <input class="input focus" type="password" value="••••••••" />
    <div class="help">Focus state · ring 3px accent/15</div>
  </div>
  <div>
    <label>Organización</label>
    <input class="input err-state" value="" placeholder="Requerido" />
    <div class="err">Este campo es necesario.</div>
  </div>
  <div>
    <label>Notas</label>
    <input class="input" value="Opcional" disabled style="background:#F9F9F7;color:#8A8A8A;" />
    <div class="help">Disabled · bg warm · fg-3</div>
  </div>
</div>
</body>
</html>
